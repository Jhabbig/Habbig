scraping:
  limit_per_source: 100
  reddit:
    # Public JSON endpoint — no OAuth needed for read-only access.
    # Set to an empty list to disable Reddit scraping.
    subreddits:
      - PredictionMarkets
      - politics
      - sportsbook
      - CryptoCurrency
      - geopolitics
  rss:
    # Substack & blog RSS feeds. Add any feed URL — the scraper handles
    # RSS 2.0 and Atom. Substack feeds are at https://<slug>.substack.com/feed.
    feeds: []
  keywords:
    prediction_keywords:
      - "will win"
      - "going to"
      - "% chance"
      - "predict"
      - "bet on"
      - "likely"
      - "odds"
      - "my prediction"
      - "I think"
      - "called it"
    category_keywords:
      politics: ["election", "president", "senate", "vote", "congress", "poll", "ballot", "referendum"]
      sports: ["championship", "finals", "match", "season", "playoffs", "league", "title", "tournament"]
      crypto: ["bitcoin", "ethereum", "btc", "eth", "token", "price target", "altcoin", "crypto"]
      geopolitics: ["war", "sanctions", "treaty", "ceasefire", "conflict", "invasion", "diplomatic"]

credibility:
  min_qualifying_predictions: 10
  min_categories_for_unlock: 3
  min_predictions_per_category: 3
  min_hours_remaining: 12
  decay_half_life_days: 60
  bayesian_prior: 0.5
  bayesian_strength: 4
  category_dominance_threshold: 0.60
  category_dominance_penalty: 0.15
  weights:
    accuracy: 0.45
    engagement: 0.18
    verified: 0.12
    volume: 0.12
    manual: 0.13
  manual_trust_delta:
    trusted: 0.20
    untrusted: -0.40
  spread_penalty:
    1: 0.30
    2: 0.60
    3: 0.85
    4: 1.00

scoring:
  risk_thresholds:
    min_global_credibility: 0.4
    min_category_credibility: 0.35
    extreme_market_bounds: [0.05, 0.95]
  market_match_threshold: 0.50
  min_shared_tokens: 3

quota:
  twitter_warn_pct: 0.80
  twitter_hard_stop_pct: 1.00

# ---------------------------------------------------------------------------
# Stage 3 — Prediction Engine (fusion layer, app/engine/).
# Hot-reloaded: app/engine/config.py watches this file's mtime, so edits here
# take effect on the next request — no redeploy.
# ---------------------------------------------------------------------------
engine:
  fusion:
    strategy: weighted_v0        # registry key in app/engine/fusion.py — swap without touching ingestion/serving
    combination: logistic        # "linear" | "logistic"
    logistic_scale: 4.0
    logistic_bias: 0.0
    weights:                     # renormalized over the signals actually present
      credibility: 0.35
      predicted_probability: 0.40
      market_implied: 0.15
      extracted_features: 0.10
    predicted_probability_key: predicted_probability
    metric_ranges:               # numeric extracted features normalized to [0,1] via [min, max]
      engagement_velocity: [0, 1000]
      source_count: [0, 50]
    calibration:
      method: none               # none | platt | isotonic — fit params via the replay harness,
      platt: {a: 1.0, b: 0.0}    # ONLY on logged predictions vs realized outcomes (never X/Reddit content)
      isotonic_points: []        # [[raw, calibrated], ...] from app.engine.fusion.fit_isotonic
  degradation:
    confidence_floor: 0.05
    missing_credibility_penalty: 0.25   # Component 1 (credibility ranker) unavailable
    missing_metrics_penalty: 0.35       # Component 2 (metric-prediction LLM) unavailable
  cache:
    ttl_seconds: 900
    max_entries: 50000
  model_tiers:                   # per job-class model routing; edit + save = live, no redeploy
    interactive: claude-opus-4-8
    pipeline: claude-haiku-4-5
    batch: claude-haiku-4-5
    replay: claude-haiku-4-5
    default: claude-haiku-4-5
  batch:
    enabled: false               # route non-interactive extraction through the Message Batches API (-50%)
    max_batch_size: 500
    flush_interval_seconds: 300
  cost:
    alert_usd_per_1k: 20.0       # alert when $/1k predictions exceeds this
    batch_discount: 0.5          # Message Batches API bills at 50%
    cached_input_discount: 0.1   # prompt-cache reads bill at ~0.1x input price
    prices_per_mtok:             # USD per 1M tokens
      claude-opus-4-8: {input: 5.0, output: 25.0}
      claude-opus-4-7: {input: 5.0, output: 25.0}
      claude-sonnet-4-6: {input: 3.0, output: 15.0}
      claude-haiku-4-5: {input: 1.0, output: 5.0}
  model_versions:
    credibility: credibility-v1  # version label for Component 1 (stamped into every audit row)
