name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Snapshot current server state
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ~/Polymarket && ./snapshot.sh save -m 'pre-deploy (auto: ${{ github.sha }})'"

      - name: Rsync files to server
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          # Live products + bots only — keep in sync with deploy.sh SITES.
          # Parked dashboards (sports, world, traders, truth, ...) are not synced.
          SITES=(
            gateway
            crypto-dashboard
            stock-dashboard
            polymarket_weather_dashboard
            midterm-dashboard
            polymarket-bot
            polymarket_weather_bot
          )
          # Keep in sync with deploy.sh EXCLUDES.
          # IMPORTANT: the env pattern is ".env*" (with glob), not bare ".env".
          # Otherwise rsync --delete wipes server-side .env.production (which is
          # intentionally not in the checkout) on every deploy. The .secret_key /
          # .encryption_key / .csrf_secret / .session_secret files are runtime-
          # generated server-side secrets (gitignored); deleting .secret_key makes
          # every Fernet-encrypted trading credential permanently undecryptable.
          EXCLUDES=(
            "__pycache__" "*.pyc" ".DS_Store" "node_modules"
            "venv" ".venv" ".git" ".snapshots" "*.log"
            ".env*" "*.db" "*.db-wal" "*.db-shm"
            ".secret_key" ".encryption_key" ".csrf_secret" ".session_secret"
          )
          exclude_args=""
          for pat in "${EXCLUDES[@]}"; do
            exclude_args="$exclude_args --exclude=$pat"
          done
          for site in "${SITES[@]}"; do
            if [ -d "$site" ]; then
              echo "Syncing $site..."
              rsync -azq --delete $exclude_args \
                "$site/" "$SERVER:~/Polymarket/$site/"
            fi
          done
          # Sync deploy scripts and shared files
          rsync -azq snapshot.sh "$SERVER:~/Polymarket/snapshot.sh"
          rsync -azq deploy/ "$SERVER:~/Polymarket/deploy/"

      - name: Restart services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'SCRIPT'
            # Live units only — must match SERVICES in deploy/install-services.sh.
            # Parked units (narve-sports, narve-world, narve-traders, ...) are
            # removed from /etc/systemd/system by install-services.sh, so
            # restarting them would fail every deploy.
            SERVICES=(
              narve-gateway
              narve-crypto
              narve-stock
              narve-weather
              narve-midterm
            )
            # Reload unit files if they changed
            sudo -n systemctl daemon-reload 2>/dev/null || true
            failed=0
            for svc in "${SERVICES[@]}"; do
              echo "Restarting $svc..."
              sudo -n systemctl restart "$svc" || { echo "FAILED to restart: $svc"; failed=1; }
            done
            sleep 5
            echo ""
            echo "Service status:"
            for svc in "${SERVICES[@]}"; do
              status=$(systemctl is-active "$svc" 2>/dev/null || true)
              echo "  $svc: $status"
              if [ "$status" != "active" ]; then
                echo "    Last 5 log lines:"
                journalctl -u "$svc" -n 5 --no-pager 2>/dev/null | sed 's/^/    /' || true
                failed=1
              fi
            done
            exit $failed
          SCRIPT

      - name: Health check
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'SCRIPT'
            echo "Checking gateway responds..."
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7000/ 2>/dev/null || echo "000")
              if [ "$code" = "200" ] || [ "$code" = "302" ]; then
                echo "  Gateway OK (HTTP $code)"
                exit 0
              fi
              echo "  Attempt $i: HTTP $code, retrying..."
              sleep 3
            done
            echo "  Gateway not responding after 3 attempts"
            exit 1
          SCRIPT
