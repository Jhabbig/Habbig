name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Snapshot current server state
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ~/Polymarket && ./snapshot.sh save -m 'pre-deploy (auto: ${{ github.sha }})'"

      - name: Rsync files to server
        run: |
          SERVER="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          # Site/exclude/protect lists live in deploy/sites.conf (shared with
          # deploy.sh and snapshot.sh). PROTECT_FILTERS keep --delete from ever
          # removing server-side generated state (cache/, data/, *.db, *.log).
          source deploy/sites.conf
          exclude_args=()
          for pat in "${EXCLUDES[@]}"; do
            exclude_args+=(--exclude="$pat")
          done
          filter_args=()
          for rule in "${PROTECT_FILTERS[@]}"; do
            filter_args+=(--filter="$rule")
          done
          for site in "${SITES[@]}"; do
            if [ -d "$site" ]; then
              echo "Syncing $site..."
              rsync -azq --delete "${exclude_args[@]}" "${filter_args[@]}" \
                "$site/" "$SERVER:~/Polymarket/$site/"
            fi
          done
          # Sync deploy scripts and shared files
          rsync -azq snapshot.sh "$SERVER:~/Polymarket/snapshot.sh"
          rsync -azq deploy/ "$SERVER:~/Polymarket/deploy/"

      - name: Restart services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'SCRIPT'
            # SERVICES comes from the just-synced deploy/sites.conf (same list
            # deploy.sh and install-services.sh use). Units not yet installed
            # are skipped with a warning instead of failing the deploy — run
            # deploy/install-services.sh on the box to install them.
            source ~/Polymarket/deploy/sites.conf
            # Keep per-service venvs current with the just-synced pinned
            # requirements (idempotent no-op when nothing changed).
            bash ~/Polymarket/deploy/bootstrap-venvs.sh
            # Reload unit files if they changed
            sudo -n systemctl daemon-reload 2>/dev/null || true
            installed=()
            for svc in "${SERVICES[@]}"; do
              if systemctl cat "$svc" >/dev/null 2>&1; then
                installed+=("$svc")
              else
                echo "SKIP $svc: unit not installed (run sudo bash deploy/install-services.sh)"
              fi
            done
            failed=0
            for svc in "${installed[@]}"; do
              echo "Restarting $svc..."
              sudo -n systemctl restart "$svc" || { echo "FAILED to restart: $svc"; failed=1; }
            done
            sleep 5
            echo ""
            echo "Service status:"
            for svc in "${installed[@]}"; do
              status=$(systemctl is-active "$svc" 2>/dev/null || true)
              echo "  $svc: $status"
              if [ "$status" != "active" ]; then
                echo "    Last 5 log lines:"
                journalctl -u "$svc" -n 5 --no-pager 2>/dev/null | sed 's/^/    /' || true
                failed=1
              fi
            done
            exit $failed
          SCRIPT

      - name: Health check
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'SCRIPT'
            echo "Checking gateway responds..."
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7000/ 2>/dev/null || echo "000")
              if [ "$code" = "200" ] || [ "$code" = "302" ]; then
                echo "  Gateway OK (HTTP $code)"
                exit 0
              fi
              echo "  Attempt $i: HTTP $code, retrying..."
              sleep 3
            done
            echo "  Gateway not responding after 3 attempts"
            exit 1
          SCRIPT
