<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Markets — 3D Globe</title>

<link href="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Cesium.js"></script>

<style>
:root {
  --bg-0: #050505; --bg-1: #111; --bg-2: #161616;
  --border: #1f1f1f; --border-light: #262626;
  --text-0: #e6e6e6; --text-1: #888; --text-2: #555;
  --green: #4ade80; --orange: #fb923c; --blue: #60a5fa; --red: #f87171;
  --mono: 'SF Mono','Cascadia Code','Fira Code','JetBrains Mono',Monaco,Consolas,monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: var(--mono); background: var(--bg-0); color: var(--text-0); font-size: 12px; overflow: hidden; }

.header {
  height: 40px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; background: rgba(10,10,10,0.85); border-bottom: 1px solid var(--border);
  position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(6px);
}
.header h1 { font-size: 13px; font-weight: 500; letter-spacing: 0.06em; }
.header h1 .accent { color: var(--green); }
.header h1 .sub { color: var(--text-1); }
.header .right { display:flex; gap: 12px; align-items: center; color: var(--text-1); font-size: 11px; }
.header a, .header button {
  color: var(--text-0); text-decoration: none; background: var(--bg-2);
  border: 1px solid var(--border); padding: 4px 10px; cursor: pointer;
  font-family: var(--mono); font-size: 11px;
}
.header a:hover, .header button:hover { border-color: var(--green); color: var(--green); }
.header input[type="date"] {
  background: var(--bg-2); color: var(--text-0); border: 1px solid var(--border);
  padding: 3px 8px; font-family: var(--mono); font-size: 11px;
}

#cesiumContainer { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; }

.layer-panel {
  /* Top of screen, leaving the bottom for Cesium animation+timeline widgets. */
  position: fixed; top: 50px; left: 12px; z-index: 90;
  width: 270px; max-height: calc(100vh - 220px);
  background: rgba(10,10,10,0.88); border: 1px solid var(--border);
  font-size: 11px; backdrop-filter: blur(6px);
  display: flex; flex-direction: column;
}
.cesium-viewer-animationContainer { left: 8px !important; bottom: 30px !important; }
.cesium-viewer-timelineContainer { left: 174px !important; right: 8px !important; bottom: 30px !important; }
.lp-header {
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.10em; color: var(--text-1);
  cursor: pointer; user-select: none;
}
.lp-header .toggle { color: var(--text-2); font-size: 9px; }
.lp-body { overflow-y: auto; flex: 1; }
.layer-panel.collapsed .lp-body { display: none; }
.lp-section { padding: 8px 12px 10px; border-bottom: 1px solid var(--bg-2); }
.lp-section:last-child { border-bottom: none; }
.lp-section-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-2); margin-bottom: 4px;
}
.lp-section label {
  display: flex; align-items: center; gap: 6px; padding: 3px 0;
  cursor: pointer; user-select: none; color: var(--text-1);
}
.lp-section label:hover { color: var(--text-0); }
.lp-section label input { accent-color: var(--green); flex-shrink: 0; }
.lp-section label .name { flex: 1; }
.lp-section label .src { color: var(--text-2); font-size: 9px; }
.lp-section .opacity { width: 100%; margin-top: 4px; accent-color: var(--green); }

.hud {
  position: fixed; bottom: 12px; right: 12px; z-index: 50;
  background: rgba(10,10,10,0.88); border: 1px solid var(--border);
  padding: 10px 14px; backdrop-filter: blur(6px);
  font-size: 11px; color: var(--text-1); min-width: 280px;
}
.hud .title { color: var(--green); margin-bottom: 6px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; }
.hud .stat { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
.hud .stat .v { color: var(--text-0); font-weight: 500; }
.hud .stat .breached { color: var(--red); }
.hud .stat .at-risk  { color: var(--orange); }
.hud .stat .safe     { color: var(--green); }
.hud .stat .ts { color: var(--text-2); font-size: 10px; }

#loading {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg-0); z-index: 200; color: var(--text-1);
  font-size: 12px; flex-direction: column; gap: 16px;
}
#loading .spinner {
  width: 32px; height: 32px; border: 2px solid var(--border-light);
  border-top-color: var(--green); border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.cesium-viewer-bottom { display: none !important; }
.cesium-credit-textContainer { display: none !important; }
.cesium-viewer-toolbar { top: 50px !important; right: 300px !important; }
.cesium-button { background: rgba(20,20,20,0.85) !important; border-color: var(--border) !important; }
</style>
</head>
<body>

<header class="header">
  <h1><span class="accent">●</span> Weather Markets / <span class="sub">3D globe + nasa imagery · scrub the timeline below</span></h1>
  <div class="right">
    <a href="/">← dashboard</a>
  </div>
</header>

<div id="loading"><div class="spinner"></div><div id="loading-msg">loading cesium…</div></div>
<div id="cesiumContainer"></div>

<aside class="layer-panel" id="layer-panel">
  <div class="lp-header" id="lp-header">
    <span>Imagery & overlays</span>
    <span class="toggle">▼</span>
  </div>
  <div class="lp-body" id="lp-body"></div>
</aside>

<div class="hud" id="hud" style="display:none">
  <div class="title">Markets &amp; tracking</div>
  <div class="stat"><span>tracked stations</span><span class="v" id="hud-stations">—</span></div>
  <div class="stat"><span>active markets</span><span class="v" id="hud-markets">—</span></div>
  <div class="stat"><span>with model forecast</span><span class="v" id="hud-forecasts">—</span></div>
  <div class="stat"><span>high-edge (≥5%)</span><span class="v at-risk" id="hud-high-edge">—</span></div>
  <div class="stat"><span>top edge</span><span class="v safe" id="hud-top-edge">—</span></div>
  <div class="stat"><span class="ts" id="hud-asof">…</span></div>
</div>

<script>
'use strict';
window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/';

// ── GIBS layer registry — weather-tuned ─────────────────────────────────────
const GIBS_LAYERS = [
  { group: 'Base imagery (replaces ESRI)', kind: 'base',
    id: 'esri',          label: 'ESRI World Imagery (no date)', static: true },
  { group: 'Base imagery (replaces ESRI)', kind: 'base',
    id: 'modis-true-terra', label: 'MODIS Terra true color',
    layer: 'MODIS_Terra_CorrectedReflectance_TrueColor',
    matrixSet: '250m', maxLevel: 9, format: 'image/jpeg' },
  { group: 'Base imagery (replaces ESRI)', kind: 'base',
    id: 'viirs-true', label: 'VIIRS SNPP true color (sharpest)',
    layer: 'VIIRS_SNPP_CorrectedReflectance_TrueColor',
    matrixSet: '250m', maxLevel: 9, format: 'image/jpeg' },

  { group: 'Cloud & precipitation', kind: 'overlay',
    id: 'cloud-temp-day', label: 'Cloud top temp (day)',
    layer: 'MODIS_Terra_Cloud_Top_Temp_Day',
    matrixSet: '2km', maxLevel: 6, format: 'image/png', defaultOpacity: 0.7 },
  { group: 'Cloud & precipitation', kind: 'overlay',
    id: 'cloud-pressure-day', label: 'Cloud top pressure (day)',
    layer: 'MODIS_Terra_Cloud_Top_Pressure_Day',
    matrixSet: '2km', maxLevel: 6, format: 'image/png', defaultOpacity: 0.6 },
  { group: 'Cloud & precipitation', kind: 'overlay',
    id: 'imerg-precip', label: 'Precipitation rate (IMERG)',
    layer: 'IMERG_Precipitation_Rate',
    matrixSet: '2km', maxLevel: 6, format: 'image/png', defaultOpacity: 0.85 },
  { group: 'Cloud & precipitation', kind: 'overlay',
    id: 'snow', label: 'Snow cover (NDSI)',
    layer: 'MODIS_Terra_NDSI_Snow_Cover',
    matrixSet: '500m', maxLevel: 8, format: 'image/png', defaultOpacity: 0.7 },

  { group: 'Surface temperature', kind: 'overlay',
    id: 'land-temp-day', label: 'Land surface temp (day)',
    layer: 'MODIS_Terra_Land_Surface_Temp_Day',
    matrixSet: '1km', maxLevel: 7, format: 'image/png', defaultOpacity: 0.75 },
  { group: 'Surface temperature', kind: 'overlay',
    id: 'land-temp-night', label: 'Land surface temp (night)',
    layer: 'MODIS_Terra_Land_Surface_Temp_Night',
    matrixSet: '1km', maxLevel: 7, format: 'image/png', defaultOpacity: 0.75 },
  { group: 'Surface temperature', kind: 'overlay',
    id: 'sst', label: 'Sea surface temperature',
    layer: 'GHRSST_L4_MUR_Sea_Surface_Temperature',
    matrixSet: '1km', maxLevel: 7, format: 'image/png', defaultOpacity: 0.7 },

  { group: 'Aerosols & fires', kind: 'overlay',
    id: 'aerosol', label: 'Aerosol optical depth',
    layer: 'MODIS_Combined_Value_Added_AOD',
    matrixSet: '2km', maxLevel: 6, format: 'image/png', defaultOpacity: 0.6 },
  { group: 'Aerosols & fires', kind: 'overlay',
    id: 'fires', label: 'Fires (MODIS, last 24h)',
    layer: 'MODIS_Combined_Thermal_Anomalies_All',
    matrixSet: '1km', maxLevel: 7, format: 'image/png', defaultOpacity: 0.9 },
];

const state = {
  viewer: null,
  /** TimeIntervalCollection covering the last N days; reused by every GIBS layer */
  gibsTimes: null,
  imageryLayers: {},
  baseLayerId: 'esri',
  citiesDS: null,
  bordersDS: null,
  showCities: true,
  showBorders: true,
  marketsByCity: {},  // city → { markets, max_edge }
};

// Day-by-day TimeIntervalCollection for GIBS time-aware imagery.
function buildGibsTimeIntervals(daysBack = 30) {
  const ivs = new Cesium.TimeIntervalCollection();
  const todayIso = new Date().toISOString().slice(0, 10);
  const startOfToday = Cesium.JulianDate.fromIso8601(todayIso + 'T00:00:00Z');
  for (let d = daysBack; d >= 0; d--) {
    const day  = Cesium.JulianDate.addDays(startOfToday, -d, new Cesium.JulianDate());
    const next = Cesium.JulianDate.addDays(day,           1, new Cesium.JulianDate());
    ivs.addInterval(new Cesium.TimeInterval({
      start: day, stop: next,
      isStartIncluded: true, isStopIncluded: false,
      data: Cesium.JulianDate.toIso8601(day).slice(0, 10),
    }));
  }
  return ivs;
}

// ── Bootstrap ───────────────────────────────────────────────────────────────
(async function init() {
  const setMsg = (m) => { const el = document.getElementById('loading-msg'); if (el) el.textContent = m; };
  if (typeof Cesium === 'undefined') { setMsg('cesium failed to load — check network'); return; }

  // Build a 30-day window of daily intervals once; every GIBS layer reuses it.
  state.gibsTimes = buildGibsTimeIntervals(30);

  const viewer = new Cesium.Viewer('cesiumContainer', {
    baseLayer: false,
    baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false,
    animation: true, timeline: true,
    fullscreenButton: true, vrButton: false, infoBox: true, selectionIndicator: true,
    scene3DOnly: true, shouldAnimate: false,
  });
  state.viewer = viewer;

  // Clock spans the last 30 days; current = yesterday. Press play to advance
  // 1 day per real second; tiles re-fetch automatically as the clock moves.
  const todayIso     = new Date().toISOString().slice(0, 10);
  const startOfToday = Cesium.JulianDate.fromIso8601(todayIso + 'T00:00:00Z');
  viewer.clock.startTime   = Cesium.JulianDate.addDays(startOfToday, -30, new Cesium.JulianDate());
  viewer.clock.stopTime    = Cesium.JulianDate.clone(startOfToday);
  viewer.clock.currentTime = Cesium.JulianDate.addDays(startOfToday, -1, new Cesium.JulianDate());
  viewer.clock.clockRange  = Cesium.ClockRange.LOOP_STOP;
  viewer.clock.multiplier  = 86400;
  viewer.timeline.zoomTo(viewer.clock.startTime, viewer.clock.stopTime);
  viewer.scene.globe.depthTestAgainstTerrain = false;
  viewer.scene.globe.enableLighting = true;
  viewer.scene.skyAtmosphere.show = true;
  viewer.scene.skyAtmosphere.brightnessShift = 0.05;
  viewer.scene.fog.enabled = true;
  viewer.scene.skyBox.show = true;
  viewer.scene.sun.show = true;
  viewer.scene.moon.show = true;
  viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#04060d');
  viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(-30, 30, 18000000) });

  // Borders
  try {
    state.bordersDS = await Cesium.GeoJsonDataSource.load('/static/countries.geojson', {
      stroke: Cesium.Color.fromCssColorString('rgba(74,222,128,0.45)'),
      fill:   Cesium.Color.fromCssColorString('rgba(74,222,128,0.02)'),
      strokeWidth: 0.8, clampToGround: true,
    });
    viewer.dataSources.add(state.bordersDS);
  } catch (e) { console.warn('borders failed', e); }

  buildLayerPanel();
  await rebuildAllLayers();
  await loadCities();
  await fetchHud();

  const hideLoading = () => {
    const el = document.getElementById('loading'); if (el) el.style.display = 'none';
    document.getElementById('hud').style.display = '';
  };
  const onTile = viewer.scene.globe.tileLoadProgressEvent.addEventListener((qLen) => {
    if (qLen <= 1) { hideLoading(); onTile(); }
  });
  setTimeout(hideLoading, 6000);
})();

// ── Imagery providers ───────────────────────────────────────────────────────
// Time-aware: {Time} placeholder is filled per-tile from the clock-active
// TimeInterval's `data` field. Cesium auto re-fetches when the clock advances.
function gibsProvider(cfg) {
  const ext = cfg.format === 'image/jpeg' ? 'jpg' : 'png';
  const opts = {
    url: `https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/${cfg.layer}/default/{Time}/${cfg.matrixSet}/{TileMatrix}/{TileRow}/{TileCol}.${ext}`,
    layer: cfg.layer, style: 'default',
    tileMatrixSetID: cfg.matrixSet, maximumLevel: cfg.maxLevel,
    format: cfg.format, tilingScheme: new Cesium.GeographicTilingScheme(),
  };
  if (cfg.static) {
    opts.url = opts.url.replace('{Time}', 'default');
  } else if (state.gibsTimes && state.viewer) {
    opts.times = state.gibsTimes;
    opts.clock = state.viewer.clock;
  }
  return new Cesium.WebMapTileServiceImageryProvider(opts);
}

async function esriProvider() {
  return await Cesium.ArcGisMapServerImageryProvider.fromUrl(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
  );
}

async function rebuildAllLayers() {
  state.viewer.imageryLayers.removeAll();
  state.imageryLayers = {};
  const baseCfg = GIBS_LAYERS.find(l => l.id === state.baseLayerId);
  let baseProvider;
  if (baseCfg && baseCfg.id === 'esri') baseProvider = await esriProvider();
  else if (baseCfg) baseProvider = gibsProvider(baseCfg);
  else baseProvider = await esriProvider();
  const baseLayer = state.viewer.imageryLayers.addImageryProvider(baseProvider);
  state.imageryLayers[state.baseLayerId] = baseLayer;

  for (const cfg of GIBS_LAYERS) {
    if (cfg.kind !== 'overlay') continue;
    const cb = document.querySelector(`input[data-overlay="${cfg.id}"]`);
    if (cb && cb.checked) {
      const layer = state.viewer.imageryLayers.addImageryProvider(gibsProvider(cfg));
      const slider = document.querySelector(`input[data-opacity="${cfg.id}"]`);
      layer.alpha = slider ? parseFloat(slider.value) : (cfg.defaultOpacity ?? 0.7);
      state.imageryLayers[cfg.id] = layer;
    }
  }
}

// ── Tracked cities (from /api/stations) ─────────────────────────────────────
async function loadCities() {
  let stations = [];
  try {
    const r = await fetch('/api/stations');
    const d = await r.json();
    stations = d.stations || [];
  } catch (e) { console.warn('/api/stations failed', e); }

  // City-level activity: count of markets per city + max forecast edge
  // (used to color station markers — red=high-edge, orange=has-edge, green=tracked, blue=no-market)
  const activity = {};
  try {
    const r = await fetch('/api/markets');
    const d = await r.json();
    const ms = d.markets || (Array.isArray(d) ? d : []);
    for (const m of ms) {
      const c = (m.city || '').toLowerCase();
      if (!c) continue;
      activity[c] = activity[c] || { markets: 0, max_edge: 0 };
      activity[c].markets++;
      const e = Math.abs(m.edge_pct ?? 0);
      if (e > activity[c].max_edge) activity[c].max_edge = e;
    }
  } catch {}
  state.marketsByCity = activity;

  const ds = new Cesium.CustomDataSource('cities');
  for (const s of stations) {
    const al = activity[s.city];
    const colorHex = al && al.max_edge >= 5 ? '#f87171'    // red — strong edge
                  : al && al.max_edge >= 2 ? '#fb923c'      // orange — moderate edge
                  : al && al.markets > 0   ? '#4ade80'      // green — active markets
                                           : '#60a5fa';     // blue — tracked, no markets
    const size = al && al.markets > 0 ? 8 : 6;
    ds.entities.add({
      position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat),
      point: {
        pixelSize: size,
        color: Cesium.Color.fromCssColorString(colorHex),
        outlineColor: Cesium.Color.fromCssColorString('rgba(0,0,0,0.6)'),
        outlineWidth: 1,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      },
      label: {
        text: s.city.toUpperCase(),
        font: '10px monospace',
        fillColor: Cesium.Color.fromCssColorString(colorHex),
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -16),
        scaleByDistance: new Cesium.NearFarScalar(2e6, 1.0, 1.5e7, 0.0),
        translucencyByDistance: new Cesium.NearFarScalar(5e6, 1.0, 1.5e7, 0.0),
      },
      description: buildStationDescription(s, al),
    });
  }
  state.viewer.dataSources.add(ds);
  state.citiesDS = ds;
  ds.show = state.showCities;
}

function buildStationDescription(s, al) {
  const stationName = s.name || s.label || s.icao;
  const rows = [
    `<tr><td style="padding:2px 8px;color:#888">city</td><td style="padding:2px 8px;color:#eee">${s.city}</td></tr>`,
    `<tr><td style="padding:2px 8px;color:#888">ICAO</td><td style="padding:2px 8px;color:#eee">${s.icao}</td></tr>`,
    `<tr><td style="padding:2px 8px;color:#888">station</td><td style="padding:2px 8px;color:#eee">${stationName}</td></tr>`,
    `<tr><td style="padding:2px 8px;color:#888">lat / lon</td><td style="padding:2px 8px;color:#eee">${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}</td></tr>`,
  ];
  // current_weather is provided by /api/stations on this dashboard
  if (s.current_weather) {
    const cw = s.current_weather;
    if (cw.temperature_f != null) rows.push(`<tr><td style="padding:2px 8px;color:#888">temp</td><td style="padding:2px 8px;color:#eee">${cw.temperature_f}°F / ${cw.temperature_c ?? '—'}°C</td></tr>`);
    if (cw.condition) rows.push(`<tr><td style="padding:2px 8px;color:#888">conditions</td><td style="padding:2px 8px;color:#eee">${cw.condition}</td></tr>`);
    if (cw.wind_mph != null) rows.push(`<tr><td style="padding:2px 8px;color:#888">wind</td><td style="padding:2px 8px;color:#eee">${cw.wind_mph} mph</td></tr>`);
  }
  if (al && al.markets > 0) {
    rows.push(`<tr><td style="padding:2px 8px;color:#888">markets</td><td style="padding:2px 8px;color:#eee">${al.markets} active · max edge ${al.max_edge.toFixed(1)}%</td></tr>`);
  }
  return `<table style="font-family:monospace;font-size:11px;border-collapse:collapse">${rows.join('')}</table>`;
}

// ── HUD: live market & forecast state ──────────────────────────────────────
async function fetchHud() {
  const set = (id, v) => {
    const el = document.getElementById(id); if (!el || v == null) return;
    el.textContent = v;
  };

  // Stations
  try {
    const stations = await fetch('/api/stations').then(r => r.json());
    set('hud-stations', (stations.stations || []).length);
  } catch {}

  // Markets — count and category distribution
  let markets = [];
  try {
    const r = await fetch('/api/markets');
    const d = await r.json();
    markets = d.markets || (Array.isArray(d) ? d : []);
  } catch {}
  set('hud-markets', markets.length);

  // Forecasts — has_forecast count, edge distribution
  try {
    const r = await fetch('/api/forecasts');
    const d = await r.json();
    const fs = d.forecasts || {};
    let fcCount = 0, highEdge = 0, topEdge = 0;
    for (const k of Object.keys(fs)) {
      const f = fs[k];
      if (f && f.model_count > 0) fcCount++;
      const e = Math.abs(f?.edge_pct ?? 0);
      if (e >= 5) highEdge++;
      if (e > topEdge) topEdge = e;
    }
    set('hud-forecasts', fcCount);
    set('hud-high-edge', highEdge);
    set('hud-top-edge', topEdge ? topEdge.toFixed(1) + '%' : '—');
  } catch {}

  set('hud-asof', `as of ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`);
}

// ── UI ──────────────────────────────────────────────────────────────────────
function buildLayerPanel() {
  const body = document.getElementById('lp-body');

  // Stations + borders section (special — toggle DataSources, not imagery)
  const sec = document.createElement('div');
  sec.className = 'lp-section';
  sec.innerHTML = `
    <div class="lp-section-title">Stations & boundaries</div>
    <label><input type="checkbox" id="t-cities" checked> <span class="name">Tracked cities</span> <span class="src">/api/stations</span></label>
    <label><input type="checkbox" id="t-borders" checked> <span class="name">Country borders</span> <span class="src">vendored</span></label>
  `;
  body.appendChild(sec);
  document.getElementById('t-cities').addEventListener('change', (e) => {
    state.showCities = e.target.checked;
    if (state.citiesDS) state.citiesDS.show = state.showCities;
  });
  document.getElementById('t-borders').addEventListener('change', (e) => {
    state.showBorders = e.target.checked;
    if (state.bordersDS) state.bordersDS.show = state.showBorders;
  });

  const groups = new Map();
  for (const cfg of GIBS_LAYERS) {
    if (!groups.has(cfg.group)) groups.set(cfg.group, []);
    groups.get(cfg.group).push(cfg);
  }
  for (const [groupName, cfgs] of groups) {
    const sec2 = document.createElement('div');
    sec2.className = 'lp-section';
    const t = document.createElement('div');
    t.className = 'lp-section-title';
    t.textContent = groupName;
    sec2.appendChild(t);
    for (const cfg of cfgs) {
      const lbl = document.createElement('label');
      const isBase = cfg.kind === 'base';
      const ctrl = isBase
        ? `<input type="radio" name="base" data-base="${cfg.id}" ${cfg.id === state.baseLayerId ? 'checked' : ''}>`
        : `<input type="checkbox" data-overlay="${cfg.id}">`;
      lbl.innerHTML = `${ctrl} <span class="name">${cfg.label}</span> <span class="src">${cfg.static ? 'no date' : 'GIBS'}</span>`;
      sec2.appendChild(lbl);
      if (cfg.kind === 'overlay') {
        const sl = document.createElement('input');
        sl.type = 'range'; sl.min = '0'; sl.max = '1'; sl.step = '0.05';
        sl.value = String(cfg.defaultOpacity ?? 0.7);
        sl.className = 'opacity'; sl.dataset.opacity = cfg.id;
        sl.addEventListener('input', (e) => {
          const layer = state.imageryLayers[cfg.id];
          if (layer) layer.alpha = parseFloat(e.target.value);
        });
        sec2.appendChild(sl);
      }
    }
    body.appendChild(sec2);
  }
  body.querySelectorAll('input[data-base]').forEach(rb => {
    rb.addEventListener('change', (e) => { state.baseLayerId = e.target.dataset.base; rebuildAllLayers(); });
  });
  body.querySelectorAll('input[data-overlay]').forEach(cb => {
    cb.addEventListener('change', () => rebuildAllLayers());
  });
  document.getElementById('lp-header').addEventListener('click', () => {
    document.getElementById('layer-panel').classList.toggle('collapsed');
  });
}
</script>
</body>
</html>
