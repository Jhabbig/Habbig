<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forecast Board — narve.ai</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/narve-shell.js" defer></script>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Forecast Board</h1>
      <div class="subtitle">Cross-venue prediction markets closing within the horizon</div>
    </div>
    <span class="fresh" id="fresh-top"><span class="dot"></span><span class="fresh-text">ingest —</span></span>
  </div>
  <nav class="pages">
    <a href="/" class="active">Board</a>
    <a href="/accuracy">Accuracy</a>
  </nav>

  <div class="ask-panel">
    <form id="ask-form" autocomplete="off">
      <input class="ask-input" id="ask-input" type="text" maxlength="300"
             placeholder="Ask about any future event…" aria-label="Ask about any future event">
      <button class="ask-btn" id="ask-btn" type="submit">Forecast</button>
    </form>
    <div id="ask-results"></div>
  </div>

  <div class="controls">
    <label>Search
      <input type="search" id="f-q" placeholder="filter questions…" aria-label="Search board questions">
    </label>
    <label>Days
      <select id="f-days">
        <option>1</option><option>2</option><option>3</option><option>5</option>
        <option selected>7</option><option>14</option><option>30</option>
      </select>
    </label>
    <label>Sort
      <select id="f-sort">
        <option value="end_date" selected>resolution date</option>
        <option value="move_24h">biggest 24h move</option>
        <option value="liquidity">liquidity</option>
        <option value="spread">tightest spread</option>
      </select>
    </label>
    <label>Venue
      <select id="f-venue">
        <option value="">all</option>
        <option value="polymarket">polymarket</option>
        <option value="kalshi">kalshi</option>
        <option value="manifold">manifold</option>
        <option value="metaculus">metaculus</option>
        <option value="options">options</option>
      </select>
    </label>
    <label>Category
      <select id="f-category"><option value="">all</option></select>
    </label>
    <label>Min conf
      <select id="f-conf">
        <option value="">any</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high">high</option>
      </select>
    </label>
    <label><input type="checkbox" id="f-micro"> 5-min markets</label>
    <span class="count" id="row-count"></span>
  </div>

  <div id="board"><div class="muted">loading…</div></div>

  <footer>
    <a href="/accuracy">Accuracy scoreboard →</a>
    <span class="fresh" id="fresh-foot"><span class="dot"></span><span class="fresh-text">ingest —</span></span>
    <span id="foot-counts"></span>
  </footer>

  <script>
    'use strict';
    const GROUP_CAP = 150;
    const VENUE_SHORT = { polymarket: 'PM', kalshi: 'KA', options: 'OPT', manifold: 'MF', metaculus: 'MC', custom: 'CU' };
    const VENUE_CLS = { PM: 'pm', KA: 'ka', OPT: 'op', MF: 'mf', MC: 'mc', CU: 'cu' };
    const MODEL_TAG = { llm: { label: 'LLM', cls: ' llm' } };
    const SORT_LABEL = { move_24h: 'biggest 24h move', liquidity: 'liquidity', spread: 'tightest spread' };
    const state = { days: '7', venue: '', category: '', conf: '', micro: false, sort: 'end_date', q: '' };
    const expanded = new Set();
    const allCats = new Set();
    let lastRows = [];

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function pct(p) {
      if (p == null) return '—';
      const v = p * 100;
      return v.toFixed(v < 10 || v > 90 ? 1 : 0) + '%';
    }

    function pp(v) {
      const s = (v * 100).toFixed(1);
      return (v >= 0 ? '+' : '') + s + 'pp';
    }

    function dayKey(iso) { return (iso || '').slice(0, 10); }

    function dayLabel(key) {
      const now = new Date();
      const todayUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      const [y, m, d] = key.split('-').map(Number);
      const diff = Math.round((Date.UTC(y, m - 1, d) - todayUTC) / 86400000);
      const dt = new Date(Date.UTC(y, m - 1, d));
      if (diff <= 0) return 'Today';
      if (diff === 1) return 'Tomorrow';
      return dt.toLocaleDateString('en-US', { weekday: 'long', timeZone: 'UTC' });
    }

    function venueBadge(v) {
      const short = VENUE_SHORT[v] || (v || '?').slice(0, 2).toUpperCase();
      return `<span class="badge ${VENUE_CLS[short] || 'ka'}">${esc(short)}</span>`;
    }

    function probCell(r) {
      let html = `<div class="prob">${pct(r.display_prob)}</div>`;
      if (r.model_prob != null) {
        const mt = MODEL_TAG[r.model_source] || { label: r.model_source || '?', cls: '' };
        html += `<span class="tag-model${mt.cls}">model · ${esc(mt.label)}</span>`;
        if (r.baseline_prob != null) html += `<span class="prob-secondary">market ${pct(r.baseline_prob)}</span>`;
      }
      return html;
    }

    function moveCell(r) {
      if (r.new) return '<span class="muted">new</span>';
      if (r.move_24h == null) return '<span class="muted">—</span>';
      if (Math.abs(r.move_24h) < 0.0005) return '<span class="muted">0.0pp</span>';
      const up = r.move_24h > 0;
      return `<span class="${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${pp(r.move_24h)}</span>`;
    }

    function disChip(r) {
      const d = r.disagreement;
      if (!d) return '';
      const links = [
        { venue: r.venue, url: r.url },
        { venue: d.counterpart_venue, url: d.counterpart_url },
      ].filter(x => x.url).map(x =>
        `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(VENUE_SHORT[x.venue] || x.venue || '?')}↗</a>`
      ).join('');
      return `<span class="chip-dis" title="baseline gap vs linked market">Δ ${esc(pp(d.delta))} ${links}</span>`;
    }

    function rowHtml(r, endsAsDate = false) {
      const q = r.url
        ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.question)}</a>`
        : esc(r.question);
      const conf = r.confidence || '?';
      const spread = r.spread == null ? '—' : (r.spread * 100).toFixed(1) + '¢';
      const ends = endsAsDate ? (r.end_date || '').slice(0, 10) : (r.end_date || '').slice(11, 16) + 'Z';
      return `<tr>
        <td class="prob-cell">${probCell(r)}</td>
        <td class="question q-cell">${q}${r.category ? ` <span class="cat">${esc(r.category)}</span>` : ''}</td>
        <td data-label="venue">${venueBadge(r.venue)}</td>
        <td data-label="ends">${esc(ends)}</td>
        <td data-label="24h">${moveCell(r)}</td>
        <td data-label="conf"><span class="conf ${esc(conf)}">${esc(conf)}</span></td>
        <td data-label="spread">${esc(spread)}</td>
        <td data-label="Δ venues">${disChip(r)}</td>
      </tr>`;
    }

    const BOARD_HEAD = `<thead><tr>
      <th>Prob</th><th>Question</th><th>Venue</th><th>Ends</th>
      <th>24h</th><th>Conf</th><th>Spread</th><th>Δ venues</th>
    </tr></thead>`;

    function render() {
      const board = document.getElementById('board');
      if (!lastRows.length) {
        board.innerHTML = '<div class="muted">no markets match — ingest may still be warming up</div>';
        document.getElementById('row-count').textContent = '';
        return;
      }
      document.getElementById('row-count').textContent = `${lastRows.length} market${lastRows.length === 1 ? '' : 's'}`;
      if (state.sort !== 'end_date') {
        renderFlat(board);
        return;
      }
      const groups = new Map();
      for (const r of lastRows) {
        const k = dayKey(r.end_date);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(r);
      }
      const parts = [];
      for (const [k, rows] of [...groups.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1)) {
        const shown = expanded.has(k) ? rows : rows.slice(0, GROUP_CAP);
        parts.push(`<section class="day-group">
          <h2>${esc(dayLabel(k))}<span class="date">${esc(k)}</span><span class="n">${rows.length} market${rows.length === 1 ? '' : 's'}</span></h2>
          <table class="board-table">
            ${BOARD_HEAD}
            <tbody>${shown.map(r => rowHtml(r)).join('')}</tbody>
          </table>
          ${rows.length > shown.length ? `<button class="show-more" data-group="${esc(k)}">show all ${rows.length}</button>` : ''}
        </section>`);
      }
      board.innerHTML = parts.join('');
    }

    function renderFlat(board) {
      const shown = expanded.has('__all') ? lastRows : lastRows.slice(0, GROUP_CAP);
      board.innerHTML = `<section class="day-group">
        <h2>All markets<span class="date">ranked by ${esc(SORT_LABEL[state.sort] || state.sort)}</span><span class="n">${lastRows.length} market${lastRows.length === 1 ? '' : 's'}</span></h2>
        <table class="board-table">
          ${BOARD_HEAD}
          <tbody>${shown.map(r => rowHtml(r, true)).join('')}</tbody>
        </table>
        ${lastRows.length > shown.length ? `<button class="show-more" data-group="__all">show all ${lastRows.length}</button>` : ''}
      </section>`;
    }

    function rebuildCategorySelect() {
      const sel = document.getElementById('f-category');
      const current = state.category;
      const opts = ['<option value="">all</option>'];
      for (const c of [...allCats].sort()) {
        opts.push(`<option value="${esc(c)}"${c === current ? ' selected' : ''}>${esc(c)}</option>`);
      }
      sel.innerHTML = opts.join('');
    }

    async function load() {
      const qs = new URLSearchParams({ days: state.days });
      if (state.venue) qs.set('venue', state.venue);
      if (state.category) qs.set('category', state.category);
      if (state.conf) qs.set('min_confidence', state.conf);
      if (state.micro) qs.set('include_micro', 'true');
      if (state.sort !== 'end_date') qs.set('sort', state.sort);
      if (state.q) qs.set('q', state.q);
      try {
        const rows = await fetch('/api/board?' + qs).then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
        lastRows = Array.isArray(rows) ? rows : [];
        for (const r of lastRows) if (r.category) allCats.add(r.category);
        rebuildCategorySelect();
        render();
      } catch (err) {
        document.getElementById('board').innerHTML =
          `<div class="muted">failed to load board: ${esc(err.message)}</div>`;
      }
    }

    // ── ask ──────────────────────────────────────────────────────────────

    function askMatchesHtml(matches) {
      const rows = matches.map(r => {
        const q = r.url
          ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.question)}</a>`
          : esc(r.question);
        const conf = r.confidence || '?';
        return `<tr>
          <td class="prob-cell"><div class="prob">${pct(r.display_prob)}</div></td>
          <td class="question q-cell">${q}${r.category ? ` <span class="cat">${esc(r.category)}</span>` : ''}</td>
          <td data-label="venue">${venueBadge(r.venue)}</td>
          <td data-label="ends">${esc((r.end_date || '').slice(0, 10))}</td>
          <td data-label="conf"><span class="conf ${esc(conf)}">${esc(conf)}</span></td>
        </tr>`;
      }).join('');
      return `<div class="ask-section-label">${matches.length} matching market${matches.length === 1 ? '' : 's'} on the board</div>
        <table class="board-table ask-matches">
          <thead><tr><th>Prob</th><th>Question</th><th>Venue</th><th>Ends</th><th>Conf</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function askCardHtml(l) {
      const conf = l.confidence || '?';
      const factors = Array.isArray(l.key_factors) ? l.key_factors : [];
      return `<div class="ask-card">
        <div class="ask-prob-row">
          <div class="ask-prob">${pct(l.probability)}</div>
          <span class="conf ${esc(conf)}">${esc(conf)}</span>
        </div>
        ${l.rationale ? `<p class="ask-rationale">${esc(l.rationale)}</p>` : ''}
        ${factors.length ? `<div class="ask-chips">${factors.map(f => `<span class="chip-factor">${esc(f)}</span>`).join('')}</div>` : ''}
        ${l.model ? `<div class="ask-model">model · ${esc(l.model)}</div>` : ''}
      </div>`;
    }

    function askResultsHtml(data) {
      const parts = [];
      if (Array.isArray(data.matches) && data.matches.length) parts.push(askMatchesHtml(data.matches));
      if (data.llm) parts.push(askCardHtml(data.llm));
      if (data.note) parts.push(`<div class="ask-note">${esc(data.note)}</div>`);
      if (!parts.length) parts.push('<div class="ask-note">no matching markets and no model forecast yet</div>');
      return parts.join('');
    }

    let askAbort = null;

    async function runAsk() {
      const out = document.getElementById('ask-results');
      const btn = document.getElementById('ask-btn');
      const question = document.getElementById('ask-input').value.trim();
      if (question.length < 5) {
        out.innerHTML = '<div class="ask-note">questions need at least 5 characters</div>';
        return;
      }
      if (askAbort) askAbort.abort();
      const ctrl = new AbortController();
      askAbort = ctrl;
      btn.disabled = true;
      out.innerHTML = `<div class="ask-loading"><span class="spinner"></span>
        Researching — matching board markets and running the model. A fresh forecast can take 30–60 seconds.</div>`;
      try {
        const r = await fetch('/api/ask?' + new URLSearchParams({ q: question }), { signal: ctrl.signal });
        if (!r.ok) {
          let detail = 'HTTP ' + r.status;
          try {
            const j = await r.json();
            if (j && j.detail) detail = j.detail;
          } catch { /* keep status text */ }
          throw new Error(detail);
        }
        out.innerHTML = askResultsHtml(await r.json());
      } catch (err) {
        if (err.name !== 'AbortError') {
          out.innerHTML = `<div class="ask-error">couldn't get a forecast: ${esc(err.message)} — try again</div>`;
        }
      } finally {
        if (askAbort === ctrl) {
          askAbort = null;
          btn.disabled = false;
        }
      }
    }

    document.getElementById('ask-form').addEventListener('submit', (e) => {
      e.preventDefault();
      runAsk();
    });
    document.getElementById('ask-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        runAsk();
      }
    });

    // ── status / bindings ────────────────────────────────────────────────

    function ago(iso) {
      if (!iso) return null;
      return Math.round((Date.now() - Date.parse(iso)) / 60000);
    }

    async function loadStatus() {
      try {
        const st = await fetch('/api/status').then(r => r.json());
        const mins = ago(st?.loops?.ingest?.last_ok);
        const err = st?.loops?.ingest?.last_error;
        const cls = mins == null ? (err ? 'bad' : '') : mins <= 15 ? 'ok' : mins <= 45 ? 'warn' : 'bad';
        const text = mins == null
          ? (err ? 'ingest failing' : 'ingest pending')
          : `ingest ${mins <= 1 ? 'just now' : mins + 'm ago'}`;
        for (const id of ['fresh-top', 'fresh-foot']) {
          const el = document.getElementById(id);
          el.querySelector('.dot').className = 'dot ' + cls;
          el.querySelector('.fresh-text').textContent = text;
        }
        const c = st?.counts;
        if (c) {
          document.getElementById('foot-counts').textContent =
            `${c.markets_active} active markets · ${c.snapshots} snapshots · ${c.model_probs} model probs`;
        }
      } catch { /* leave stale indicator */ }
    }

    document.getElementById('board').addEventListener('click', (e) => {
      const btn = e.target.closest('.show-more');
      if (!btn) return;
      expanded.add(btn.dataset.group);
      render();
    });

    const bind = (id, key) => document.getElementById(id).addEventListener('change', (e) => {
      state[key] = e.target.value;
      expanded.clear();
      load();
    });
    bind('f-days', 'days');
    bind('f-sort', 'sort');
    bind('f-venue', 'venue');
    bind('f-category', 'category');
    bind('f-conf', 'conf');
    document.getElementById('f-micro').addEventListener('change', (e) => {
      state.micro = e.target.checked;
      expanded.clear();
      load();
    });

    let qTimer = null;
    document.getElementById('f-q').addEventListener('input', (e) => {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => {
        const v = e.target.value.trim();
        if (v === state.q) return;
        state.q = v;
        expanded.clear();
        load();
      }, 300);
    });

    load();
    loadStatus();
    setInterval(load, 60000);
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
