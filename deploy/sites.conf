# deploy/sites.conf — single source of truth for deploy/backup tooling.
# Sourced by deploy.sh, snapshot.sh, deploy/install-services.sh, and
# .github/workflows/deploy.yml (locally and on the server) — plain bash
# arrays only, no external commands.

SITES=(
    gateway
    crypto-dashboard
    stock-dashboard
    sports-dashboard
    polymarket_weather_dashboard
    world-state-dashboard
    midterm-dashboard
    Dashboard-x-truth-research-prediction
    polymarket-bot
    polymarket_weather_bot
    top-traders-dashboard
    climate-dashboard
    centralbank-dashboard
    voters-dashboard
    world-health-dashboard
)

# Never rsynced or tarred — except .env*, which snapshot.sh re-includes in
# tars (snapshots are the only backup of per-site secrets). cache/ and *.pkl
# are load-bearing: crypto-dashboard/cache alone is ~17GB of regenerable API cache.
EXCLUDES=(
    "__pycache__"
    "*.pyc"
    ".DS_Store"
    "node_modules"
    "venv"
    ".venv"
    ".git"
    ".snapshots"
    "*.log"
    ".env"
    "*.db"
    "*.db-wal"
    "*.db-shm"
    "*.sqlite"
    "*.sqlite3"
    "cache"
    "*.pkl"
)

# rsync protect rules (passed as --filter): server-side generated state that
# a --delete sync from a fresh checkout must never remove. The /*** form
# protects the directory AND its contents at any depth.
PROTECT_FILTERS=(
    "P .env*"
    "P cache/***"
    "P data/***"
    "P *.db*"
    "P *.log"
    "P *.pkl"
)

# systemd units CI restarts after a deploy. Gateway first.
SERVICES=(
    narve-gateway
    narve-crypto
    narve-sports
    narve-weather
    narve-world
    narve-midterm
    narve-traders
    narve-stock
    narve-climate
    narve-centralbank
    narve-voters
    narve-world-health
)
