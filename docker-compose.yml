services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD env var}"
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD env var}", "ping"]
      interval: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-narve}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD env var}"
      POSTGRES_DB: "${POSTGRES_DB:-narve}"
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-narve} -d ${POSTGRES_DB:-narve}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:7000:7000"
    # Gitignored — only exists where the operator created it, so it must be
    # optional for `docker compose config/up` to work in a fresh checkout.
    env_file:
      - path: ./gateway/.env
        required: false
    environment:
      # Point the gateway at the bundled Postgres. Overrides any DATABASE_URL
      # in gateway/.env. Remove this block to fall back to SQLite.
      DATABASE_URL: "postgres://${POSTGRES_USER:-narve}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD env var}@postgres:5432/${POSTGRES_DB:-narve}"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      crypto:
        condition: service_healthy
      stock:
        condition: service_healthy
      midterm:
        condition: service_healthy
      weather:
        condition: service_healthy

  crypto:
    build: ./crypto-dashboard
    expose:
      - "8000"
    env_file:
      - path: ./crypto-dashboard/.env
        required: false
    volumes:
      - crypto-data:/app/data
    restart: unless-stopped
    healthcheck:
      # python3, not curl: the python:3.12-slim base image ships no curl,
      # so a curl-based healthcheck can never report healthy.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3

  stock:
    build: ./stock-dashboard
    expose:
      - "8050"
    env_file:
      - path: ./gateway/.env.production
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3

  midterm:
    build: ./midterm-dashboard
    expose:
      - "8051"
    env_file:
      - path: ./gateway/.env.production
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3

  weather:
    build: ./polymarket_weather_dashboard
    expose:
      - "5050"
    env_file:
      - path: ./gateway/.env.production
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # climate + disasters were merged into the weather service: they run as
  # tabs of the weather dashboard with APIs under /api/climate/* and
  # /api/disasters/*. Parked dashboards (sports, world, top-traders,
  # centralbank, airace, crypto-trackers, religion, whale) are no longer
  # composed at all — the gateway serves a parked notice on their
  # subdomains and /admin/fleet tracks the effects.

volumes:
  gateway-data:
  postgres-data:
  crypto-data:
